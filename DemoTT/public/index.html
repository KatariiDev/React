<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="ticket ticket1">
            <img src="" alt="">
            <div class="content">
                <p class="price">1,000 VNĐ</p>
                <p class="desc">Vé Thường</p>
                <button class="buy" value="1000">Đặt vé</button>
            </div>
            
        </div>
        <div class="ticket ticket2">
            <img src="" alt="">
            <div class="content">
                <p class="price">2,000 VNĐ</p>
                <p class="desc">Vé Vừa</p>
                <button class="buy" value="2000">Đặt vé</button>
            </div>
            
        </div>
        <div class="ticket ticket3">
            <img src="" alt="">
            <div class="content">
                <p class="price">3,000 VNĐ</p>
                <p class="desc">Vé VIP</p>
                <button class="buy" value="3000">Đặt vé</button>
            </div>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <h4>Mã QR Thanh Toán (Quét bằng MoMo/Bank):</h4>
        <div style="font-weight: bold; margin-bottom: 5px;" id="thongTinThanhToan"></div>
        <img id="anhQR" src="" alt="Chọn vé để hiển thị mã QR" style="width: 250px; height: 250px; border: 1px solid #ddd; display: none; margin: 0 auto;"/>    
    </div>


    <div class="payment-config">
        <label for="bankAccount" class="choice">
            Chọn tài khoản thanh toán:
        </label>

        <select id="bankAccount">
            <option value="">-- Đang tải tài khoản --</option>
        </select>

        <p id="selectedBank"></p>

        <button id="confirmBank" type="button">
            Xác nhận
        </button>

        <p id="confirmMessage"></p>
    </div>

    <script src="./main.js"></script>
</body>
</html>
